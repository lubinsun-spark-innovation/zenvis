name: Deploy main

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      COMPONENT: zenvis
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment assets
        shell: bash
        env:
          ARCH: amd64
          ZENVIS_IMAGE_REGISTRY: ci.invalid/zenvis
          KAFKA_CLUSTER_ID: ci-validation-cluster
          MYSQL_ROOT_PASSWORD: ci-validation-only
          MYSQL_PASSWORD: ci-validation-only
          CLICKHOUSE_PASSWORD: ci-validation-only
          REDIS_PASSWORD: ci-validation-only
          API_BEARER_TOKEN: ci-validation-only
          MCP_BEARER_TOKEN: ci-validation-only
          VECTUM_AUTH_TOKEN: ci-validation-only
          LUBINSUN_BASE_URL: http://127.0.0.1:18000/api
          LUBINSUN_INTEGRATION_TOKEN: ci-validation-only
          ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ci-validation-only
          ZENVIS_BOOTSTRAP_ADMIN_PASSWORD: ci-validation-only
          ZENVIS_BACKEND_IMAGE: validation/backend:ci
          ZENVIS_FRONTEND_IMAGE: validation/frontend:ci
        run: |
          set -Eeuo pipefail
          bash -n zenvisctl quick-deploy.sh
          bash -n deploy/automation/lubinsun-deploy deploy/automation/lubinsun-deploy-ssh-entry
          docker run --rm \
            --add-host zenvis-backend:127.0.0.1 \
            -v "$PWD/deploy/config/zenvis-frontend/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.25.3-alpine@sha256:f2802c2a9d09c7aa3ace27445dfc5656ff24355da28e7b958074a0111e3fc076 nginx -t
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml \
            -f deploy/docker-compose.automation.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
          git diff --check

      - name: Reconcile validated revision
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY is required}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?DEPLOY_SSH_KNOWN_HOSTS is required}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPONENT" == zenvis ]]

          ssh_dir="$RUNNER_TEMP/lubinsun-deploy-ssh"
          install -m 700 -d "$ssh_dir"
          trap 'rm -f "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >"$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          known_host="$DEPLOY_HOST"
          [[ "$DEPLOY_PORT" == 22 ]] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$known_host" -f "$ssh_dir/known_hosts" >/dev/null

          remote_command="/home/lubinsun/.local/bin/lubinsun-deploy deploy $COMPONENT $GITHUB_REPOSITORY $GITHUB_SHA"
          ssh -i "$ssh_dir/id_ed25519" -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -- "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
