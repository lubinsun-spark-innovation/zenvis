name: Deploy Zenvis stack to Alibaba Cloud

on:
  push:
    branches:
      - feature/aliyun-cloudflare-deployment-20260813
    paths:
      - ".github/workflows/deploy-aliyun.yml"
      - "deploy/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on the Alibaba Cloud server
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - deploy
      backend_ref:
        description: zenvis-backend branch, tag, or commit
        required: true
        default: feature/aliyun-cloudflare-deployment-20260813

permissions:
  contents: read

concurrency:
  group: zenvis-aliyun-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Collect remote pre-deployment diagnostics
        continue-on-error: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: ./deploy/ci/diagnose.sh

      - name: Checkout backend
        if: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        uses: actions/checkout@v4
        with:
          repository: lubinsun-spark-innovation/zenvis-backend
          ref: ${{ inputs.backend_ref || 'feature/aliyun-cloudflare-deployment-20260813' }}
          path: backend

      - name: Set up Java 17
        if: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit tests
        if: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest='*Test,!WebServiceApplicationTests,!PluginUpgradeUiConfigTest,!SkillServiceTest,!ClickhouseRecordIdMigrationIntegrationTest,!McpChatToolGrantPersistenceTest,!MenuTest'
          test

      - name: Package backend
        if: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Build and deploy release
        if: ${{ github.event_name == 'push' || inputs.operation == 'deploy' }}
        env:
          DEPLOY_IMAGE_TAG: infra-${{ github.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${{ secrets.ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD }}
          ZENVIS_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.ZENVIS_BOOTSTRAP_ADMIN_PASSWORD }}
        run: ./deploy/ci/deploy.sh ./backend .
