services:
  kafka-service:
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 640M
        reservations:
          cpus: "0.10"
          memory: 256M

  redis-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 64M

  redis-stack-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 128M

  mysql-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 256M

  clickhouse-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 384M

  zenvis-backend:
    image: ${ZENVIS_BACKEND_IMAGE:?ZENVIS_BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1280M
        reservations:
          cpus: "0.25"
          memory: 512M

  vectum-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 640M
        reservations:
          cpus: "0.10"
          memory: 256M

  # The public frontend is hosted by Cloudflare. Keeping this service behind a
  # profile prevents the Alibaba Cloud host from starting a second frontend.
  zenvis-frontend:
    profiles:
      - server-web-disabled
    restart: unless-stopped
