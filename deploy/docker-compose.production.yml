services:
  kafka-service:
    restart: unless-stopped

  redis-service:
    restart: unless-stopped

  redis-stack-service:
    restart: unless-stopped

  mysql-service:
    restart: unless-stopped

  clickhouse-service:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  zenvis-backend:
    image: ${ZENVIS_BACKEND_IMAGE:?ZENVIS_BACKEND_IMAGE is required}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  vectum-service:
    restart: unless-stopped

  # The public frontend is hosted by Cloudflare. Keeping this service behind a
  # profile prevents the Alibaba Cloud host from starting a second frontend.
  zenvis-frontend:
    profiles:
      - server-web-disabled
    restart: unless-stopped
