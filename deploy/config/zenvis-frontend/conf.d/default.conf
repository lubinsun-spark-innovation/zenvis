server {
    listen 11000;
    listen [::]:11000;
    server_name _;

    # Docker 容器重建后 IP 可能变化。通过 Docker 内置 DNS 动态解析
    # 后端服务名，避免 Nginx 长时间缓存启动时解析到的旧地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $zenvis_backend zenvis-backend:11001;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 300m;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /amis/app.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /amis/page.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /amis/plugin-ui/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location ~ ^/amis/sdk/sdk\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /zenvis/ {
        rewrite ^/zenvis(.*)$ $1 break;
        proxy_pass http://$zenvis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
