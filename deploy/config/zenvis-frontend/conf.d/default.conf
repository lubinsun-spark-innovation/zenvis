map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 11000;
    listen [::]:11000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 300m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /amis/page.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /amis/app.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /amis/sdk-v6.7.0/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /amis/sdk/ {
        alias /usr/share/nginx/html/amis/sdk-v6.7.0/;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/amis/js/(axios\.min|history|vue)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Analyzer is intentionally reachable only through this authenticated,
    # same-origin path. The subrequest forwards the existing ZenVis session
    # without a request body and expects 2xx for an authenticated user or 401.
    location = /_internal/auth/analyzer {
        internal;
        proxy_pass http://zenvis-backend:11001/api/v1/system/login/session/check;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host zenvis-backend;
    }

    location = /analyzer {
        return 308 /analyzer/;
    }

    location ^~ /analyzer/ {
        auth_request /_internal/auth/analyzer;

        # Resolve at request time so the ZenVis frontend can still start while
        # Analyzer is being replaced by its independent deployment workflow.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $analyzer_upstream zenvis-service-analyzer:18080;

        # Keep the prefix intact: Analyzer accepts /analyzer/, strips it inside
        # its own router, and generates browser asset/API/WebSocket URLs with
        # the same prefix.
        proxy_pass http://$analyzer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /analyzer;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /zenvis/ {
        rewrite ^/zenvis(.*)$ $1 break;
        proxy_pass http://zenvis-backend:11001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
