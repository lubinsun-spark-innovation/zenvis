services:
  mysql-service:
    ports: !override
      - "${ZENVIS_INFRA_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-13306}:3306"

  zenvis-backend:
    image: ${ZENVIS_BACKEND_IMAGE:?ZENVIS_BACKEND_IMAGE is required}

  zenvis-frontend:
    image: ${ZENVIS_FRONTEND_IMAGE:?ZENVIS_FRONTEND_IMAGE is required}
