services:
  mysql:
    volumes: !override
      - ./mysql/data:/var/lib/mysql
      - ./mysql/backups:/backups

  tool-executor-local:
    volumes: !override
      - agent-data:/var/lib/lubinsun-agent
      - tool-executor-local-socket:/run/lubinsun-executor-local

  tool-executor-standard:
    volumes: !override
      - agent-data:/var/lib/lubinsun-agent
      - tool-executor-standard-socket:/run/lubinsun-executor-standard

  tool-executor-privileged:
    volumes: !override
      - agent-data:/var/lib/lubinsun-agent
      - tool-executor-privileged-socket:/run/lubinsun-executor-privileged

  backend:
    volumes: !override
      - agent-data:/var/lib/lubinsun-agent
      - ./skills:/app/skills:ro
      - tool-executor-local-socket:/run/lubinsun-executor-local
      - tool-executor-standard-socket:/run/lubinsun-executor-standard
      - tool-executor-privileged-socket:/run/lubinsun-executor-privileged

  frontend:
    image: ${FRONTEND_IMAGE:-lubinsun-agent-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${LOCAL_BIND_HOST:?LOCAL_BIND_HOST is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}:80"

volumes:
  agent-data:
    external: true
    name: lubinsun-test_agent-data
